<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário HTML</title>
</head>
<body>
    <header>
        <h3>Formulários e Inputs</h3>
    </header>
    <main>
        <form id="resgisterForm" method="POST">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required/>
            <br>
            <label for="endereco">Endereço de e-mail:</label>
            <input type="email" id="email" name="email" required/>
            <br>
            <label for="senha">Informe sua senha:</label>
            
            <input type="password" id="senha"
            name="senha" required minlength="8">
    
            <br>
            <label for="mensagem">Informe sua mensagem: </label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento">Selecione o evento escolhido:</label>
            <!-- Tag de seletor, ao selecionar uma das opções o value da option é atribuido ao nme do select -->
            <!-- key:value -->
            <!-- evento = teatro -->
            <select id="evento" name="evento">
                <option value="rock">Show de Rock</option>
                <option value="modao">Show de Sertanejo</option>
                <option value="teatro">Teatro: Comédia</option>
            </select>
            <br>
           <!--Input Checkbor -> Opção de multipla escolha: --> 
           <label for="termos">
            <input type="checkbox" id="termos" name="termos" required>
            Aceito os termos de uso
           </label>
           <br>
           <!--Input type radio - Escolha única-->
           <ilabel><input type="radio" name="pagamento" value="pix"/>Pix</label>
           <label><input type="radio" name="pagamento" value="pix"/>Cartão</label>
           <br>
           <Input type="date"/>
           <br>
           <input type="file"/> 
           <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}.d{3}-\2{d}" title="Formato esperado: 000.000.000-00"/>

        
           <!--Para o type radio funcionar ambos os inputs devem compartilhar o mesmo name-->
           <br>
            <input type="submit" value="Cadastrar"/>
            <button type="button" onclick="">Cancelar</button>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por Ygor</p>
    </footer>    
    
    <script>
        document.getElementById("registerForm").addEventListener("submit", function (event) {
            event.preventDefault(); // impede o comportamento pada~r de envio do formulário (recarregamneto)
            const nome = document.getElementById("nome").value;
            alert("Ola, "+ nome+" Cadastro enviado com sucesso");
        })
    </script>

</body>
</html>
